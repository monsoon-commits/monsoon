<body>

</div>

<p class="note">PC 또는 스마트폰 가로 화면에서 더욱 잘 보여요</p>
</div>

{bg:'#dbe8f5',rain:1,cap:'갑자기 비가 쏟아져요',items:[['a','🌧️',50,24,90,'float'],['a','🏪',50,66,78,'']]},
{bg:'#cfe0f0',rain:1,cap:'가게배달은 먼 거리 주문까지 계속 들어와요',items:[['a','🛵',32,62,84,'shake'],['a','🗺️',72,58,72,'float'],['g','배달 거리 4km',50,16,''],['b','이 비에 4km는 너무 멀어…',50,88,'']]},
{bg:'#ffe3e3',cap:'배달은 늦어지고 음식은 식어가요',items:[['a','🥡',28,60,72,'float'],['a','😓',70,58,86,'shake'],['g','배달 지연 · 고객 문의',50,16,'red']]},
{bg:'#e3f4f3',cap:'그럼 어떻게 해결하지? 🤔',items:[['b','비 오는 날엔 배달 반경을 줄여볼까?',50,18,'soft'],['a','🤔',50,58,96,'bounce']]}]}
};
var hooks=$('hooks');
ORDER.forEach(function(k){
var h=HOOK[k], b=document.createElement('button'); b.className='hcard'; b.dataset.k=k;
b.innerHTML='<div class="hth" style="background:'+h.bg+'">'+h.thumb.map(function(e){return '<span>'+e+'</span>';}).join('')+'</div><span class="htag">'+h.tag+'</span><div class="hq">'+h.q+'</div><div class="hgo">이야기 보기 →</div>';
hooks.appendChild(b);
});
hooks.addEventListener('click',function(e){var t=e.target.closest('[data-k]'); if(t) openStory(t.dataset.k);});
var sk=null, sf=0, stimer=null;
function sitem(it){
if(it[0]==='a') return '<div class="actor" style="left:'+it[2]+'%;top:'+it[3]+'%;font-size:'+it[4]+'px"><i class="a-'+(it[5]||'none')+'">'+it[1]+'</i></div>';
return '<div class="'+(it[0]==='b'?'bub':'bdg')+' '+(it[4]||'')+'" style="left:'+it[2]+'%;top:'+it[3]+'%">'+it[1]+'</div>';
}
function drops(){var d='';for(var i=0;i<26;i++){d+='<span class="drop" style="left:'+(Math.random()*100).toFixed(1)+'%;animation-delay:'+(Math.random()).toFixed(2)+'s;animation-duration:'+(0.7+Math.random()*0.5).toFixed(2)+'s"></span>';}return d;}
function openStory(k){
sk=k; sf=0;
document.querySelectorAll('.hcard').forEach(function(n){n.classList.toggle('on',n.dataset.k===k);});
$('player').hidden=true; $('storyBox').hidden=false;
var F=HOOK[k].frames;
$('story').innerHTML=F.map(function(f){return '<div class="fr" style="background:'+f.bg+'"><div class="sc">'+(f.rain?drops():'')+f.items.map(sitem).join('')+'</div><div class="cap">'+f.cap+'</div></div>';}).join('');
$('storyBox').scrollIntoView({behavior:'smooth',block:'start'});
showFrame(0); autoplay();
}
function showFrame(i){
var F=HOOK[sk].frames; sf=i;
var frs=$('story').children;
for(var j=0;j<frs.length;j++) frs[j].classList.toggle('on',j===i);
$('sdots').innerHTML=F.map(function(_,j){return '<div class="dot'+(j<=i?' on':'')+'"></div>';}).join('');
var last=i===F.length-1;
$('scta').innerHTML=last?'<div class="finish"><h3>그럼 어떻게 해결하지? 🤔</h3><p>직접 눌러보면 1분이면 끝나요.</p><button class="fb pri" id="s-go">해결 방법 보러 가기 →</button></div>':'';
if(last){ clearInterval(stimer); $('s-go').onclick=startSim; }
}
function autoplay(){
clearInterval(stimer);
stimer=setInterval(function(){ if(sf<HOOK[sk].frames.length-1) showFrame(sf+1); else clearInterval(stimer); },3000);
}
$('story').onclick=function(){ if(sk && sf<HOOK[sk].frames.length-1){ showFrame(sf+1); autoplay(); } };
$('s-replay').onclick=function(){ showFrame(0); autoplay(); };
$('s-skip').onclick=function(){ showFrame(HOOK[sk].frames.length-1); };
function startSim(){ clearInterval(stimer); $('storyBox').hidden=true; $('player').hidden=false; open(sk,false); }
$('btn-home').onclick=function(){ $('player').hidden=true; document.querySelectorAll('.hcard').forEach(function(n){n.classList.remove('on');}); document.querySelector('h1').scrollIntoView({behavior:'smooth',block:'start'}); };
function open(k,init){
cur=k; step=0;
document.querySelectorAll('.hcard').forEach(function(n){n.classList.toggle('on',n.dataset.k===k);});
$('ptitle').textContent=GUIDES[k].title;
render();
if(!init) $('player').scrollIntoView({behavior:'smooth',block:'start'});
}
function fit(){
var stage=$('stage'), cv=$('canvas');
var sc=Math.min(1,stage.clientWidth/1000);
cv.style.transform='scale('+sc+')';
stage.style.height=(640*sc)+'px';
return sc;
}
function render(){
var g=GUIDES[cur], s=g.steps[step], cv=$('canvas');
cv.innerHTML=s.render();
var sc=fit();
$('dots').innerHTML=g.steps.map(function(_,i){return '<div class="dot'+(i<=step?' on':'')+'"></div>';}).join('');
$('prev').disabled=step===0;
var fin=$('finish'); fin.innerHTML='';
if(s.target){
var t=$(s.target);
if(t){
t.classList.add('hl');
t.addEventListener('click',function(e){e.stopPropagation(); if(step<g.steps.length-1){step++;render();}});
position(t,s.tip,sc);
}
cv.onclick=function(e){
if(e.target.closest('.hl')||e.target.closest('.tip')) return;
cv.classList.remove('shake'); void cv.offsetWidth; cv.classList.add('shake');
};
} else {
cv.onclick=null;
fin.innerHTML='<div class="finish"><h3>이제 직접 설정해 볼까요?</h3><p>설정은 1분이면 끝나요. 취소를 줄이면 고객 불편도, 가게 노출 걱정도 줄어요.</p><button class="fb pri" id="go">즉시 설정해요</button><button class="fb" id="other">다른 가이드 보기</button></div>';
$('go').onclick=function(){var u=GO[cur]; if(u){window.open(u,'_blank');}else{alert('설정 화면 링크 연결 예정입니다.');}};
$('other').onclick=function(){document.querySelector('h1').scrollIntoView({behavior:'smooth',block:'start'});};
}
}
function position(t,text,sc){
var cv=$('canvas'), tip=document.createElement('div');
tip.className='tip'; tip.innerHTML='<span>'+text+'</span><button aria-label="닫기">×</button>';
cv.appendChild(tip);
tip.querySelector('button').onclick=function(e){e.stopPropagation();tip.remove();};
var cr=cv.getBoundingClientRect(), tr=t.getBoundingClientRect();
var x=(tr.left-cr.left)/sc, y=(tr.top-cr.top)/sc, w=tr.width/sc, h=tr.height/sc;
var tw=tip.offsetWidth, th=tip.offsetHeight, cx=x+w/2;
var left=Math.max(10,Math.min(cx-tw/2,1000-tw-10));
var top=y+h+16;
if(top+th>630){top=y-th-16; tip.classList.add('up');}
tip.style.left=left+'px'; tip.style.top=top+'px'; tip.style.setProperty('--ax',(cx-left)+'px');
}
$('prev').onclick=function(){ if(step>0){step--;render();} };
$('restart').onclick=function(){ step=0; render(); };
window.addEventListener('resize',function(){ if(cur) render(); });
})();
(function(){
function fitFrame(){ try{ if(window.frameElement){ window.frameElement.style.height=(document.documentElement.scrollHeight+4)+'px'; } }catch(e){} }
if(window.ResizeObserver){ new ResizeObserver(fitFrame).observe(document.body); }
window.addEventListener('load',fitFrame); window.addEventListener('resize',fitFrame); setInterval(fitFrame,800);
})();
</script>
